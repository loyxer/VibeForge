# Render's free plan puts the backend to sleep after 15 minutes without
# requests, and waking it takes about a minute — long enough for a new
# visitor to think VibeForge is broken. This knocks on it every 10 minutes.
#
# Free: GitHub Actions minutes are unlimited for public repositories, and
# one always-on free service fits Render's 750 free hours a month (if they
# ever ran out, Render pauses the service; it never charges). GitHub may
# run a scheduled job a few minutes late, and turns it off after 60 days
# without commits. To stop it, delete this file.
name: Keep the backend awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: # a "Run workflow" button, to try it by hand

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Knock on /health
        run: curl --fail --silent --show-error --max-time 120 --retry 2 https://vibeforge-e0p3.onrender.com/health
