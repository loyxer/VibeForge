# Automatic checks on every push and pull request: the backend tests and the
# frontend type check + build. A broken change shows a red cross on GitHub
# instead of breaking the live site first.
#
# Free: GitHub Actions minutes are unlimited for public repositories. Render
# can be set to deploy only after these checks pass (Settings -> Auto-Deploy ->
# "After CI Checks Pass"); Vercel deploys on its own.
name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      # Tests run in plain local mode (mock generator, no Supabase, no Telegram)
      # — see backend/tests/conftest.py — so no secrets are needed here.
      - run: pytest -q

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # tsc type check, then the production build
      - run: npm run build
